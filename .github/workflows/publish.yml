name: npm publish / unpublish
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Which npm operation to run.'
        required: true
        type: choice
        options:
          - publish
          - unpublish
        default: publish
      release_tag:
        description: '[publish] Git ref to publish — tag (e.g. 2.0.2), branch, or commit SHA. The commit at this ref is published; its package.json version lands on npm.'
        required: false
        type: string
      version:
        description: '[unpublish] npm version to target (e.g. 2.0.2).'
        required: false
        type: string
      skip_git_tag:
        description: '[publish] Skip creating and force-pushing the {version} and "latest" git tags after publish.'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    if: ${{ inputs.action == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create and push git tags
        if: ${{ !inputs.skip_git_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -af "${VERSION}" -m "Version ${VERSION}"
          git push origin "${VERSION}" --force
          git tag -af "latest" -m "Latest release ${VERSION}"
          if ! git push origin "latest" --force; then
            echo "::warning::Unable to push 'latest' tag with GITHUB_TOKEN permissions. Publish already completed."
          fi

  unpublish:
    if: ${{ inputs.action == 'unpublish' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::'version' input is required for the unpublish action"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - name: Unpublish @younglim/extract-zip@${{ inputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: npm unpublish "@younglim/extract-zip@${VERSION}"
